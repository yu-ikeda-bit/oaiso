<title>おあいそ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 片手で操作する店の道具。上に卓の状況、下にタブ、右下に大きなマイク。 */
:root{
  --bg:#f1f4f1; --surface:#ffffff; --sunk:#e6ebe7; --ink:#1b2321; --muted:#5b6864; --line:#d5ddd8;
  --ai:#24466e; --ai-ink:#ffffff; --sugi:#5d7230; --sugi-soft:#e7edd8;
  --warn:#a85213; --warn-soft:#fbeadb; --danger:#b3261e; --ok:#2b7a4b;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2220; --sunk:#232d2a; --ink:#e5ebe8; --muted:#9aa8a3; --line:#2e3a37;
  --ai:#8db0dc; --ai-ink:#0e1a28; --sugi:#a9bf6c; --sugi-soft:#2a3320;
  --warn:#eb9a5c; --warn-soft:#3a2716; --danger:#f08b84; --ok:#7cc89b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2220; --sunk:#232d2a; --ink:#e5ebe8; --muted:#9aa8a3; --line:#2e3a37;
  --ai:#8db0dc; --ai-ink:#0e1a28; --sugi:#a9bf6c; --sugi-soft:#2a3320;
  --warn:#eb9a5c; --warn-soft:#3a2716; --danger:#f08b84; --ok:#7cc89b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.06em;white-space:nowrap}
.sync{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sugi-soft);color:var(--sugi);white-space:nowrap}
.sync[data-st="offline"],.sync[data-st="error"]{background:var(--warn-soft);color:var(--warn)}
.top .today{margin-left:auto;text-align:right;line-height:1.2;font-size:12px;color:var(--muted)}
.top .today b{display:block;font-size:17px;color:var(--ink)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
h2{font-family:var(--f-disp);font-size:22px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner button{margin-left:auto}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700}
.btn.pri{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.btn.sugi{background:var(--sugi);color:var(--surface);border-color:var(--sugi)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
/* tables grid */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;min-height:104px;display:flex;flex-direction:column;gap:4px}
.tcard .tn{font-family:var(--f-disp);font-size:22px;line-height:1.1}
.tcard.empty{background:transparent;border-style:dashed;color:var(--muted)}
.tcard.busy{border-color:var(--ai);box-shadow:inset 4px 0 0 var(--ai)}
.tcard .amt{font-size:18px;font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.sugi{background:var(--sugi-soft);color:var(--sugi)}
/* ticket */
.tk-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tk-head .tn{font-family:var(--f-disp);font-size:30px;line-height:1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stepper button{border:0;background:transparent;width:40px;height:40px;font-size:20px;font-weight:700}
.stepper span{min-width:2.4em;text-align:center;font-weight:700}
.custbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.custbox .grow{font-size:13px}
.lines{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{flex:1;min-width:0}
.line .nm small{color:var(--muted);margin-left:4px}
.line .sub{width:6.5em;text-align:right;font-weight:700}
.line.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--sugi-soft)}to{background:transparent}}
.empty-note{padding:18px 12px;color:var(--muted);text-align:center;font-size:13px}
.tk-total{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.tk-total .sum{font-family:var(--f-disp);font-size:30px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:6px}
.cats button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;min-height:58px;font-weight:700;line-height:1.3}
.quick button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
/* nav + mic */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:transparent;height:var(--nav-h);font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ai)}
.mic{position:fixed;z-index:7;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  width:84px;height:84px;border-radius:50%;border:0;background:var(--ai);color:var(--ai-ink);box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center}
.mic svg{width:38px;height:38px}
.mic.on{background:var(--danger);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}70%{box-shadow:0 0 0 18px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
.hf{position:fixed;z-index:7;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.hf[aria-pressed="true"]{background:var(--sugi);border-color:var(--sugi);color:var(--surface)}
.live{position:fixed;z-index:7;left:calc(16px + env(safe-area-inset-left,0px));right:calc(210px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px}
@media (max-width:520px){.live{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 112px + env(safe-area-inset-bottom,0px))}}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{margin-bottom:12px}
.sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field label:has(input[type=checkbox]){display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
.field input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--ai)}
.field input:not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.countdown{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:12px}
.countdown i{display:block;height:100%;background:var(--sugi);width:100%;transform-origin:left}
.raw{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 10px;margin-bottom:10px}
.pv{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pv select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px;min-height:40px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--ai-ink)}
.bill{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.bill .big{font-family:var(--f-disp);font-size:30px}
/* reports */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.kpi b{display:block;font-size:22px}
.kpi.main{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.kpi.main span{color:inherit;opacity:.85}
.kpi.main b{font-family:var(--f-disp);font-size:28px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);background:var(--sunk)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 8px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.bars .b i{display:block;width:100%;max-width:26px;background:var(--sugi);border-radius:3px 3px 0 0;min-height:1px}
.bars .b.sel i{background:var(--ai)}
.bars .b small{font-size:10px;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.list > button{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px;min-height:56px}
.list > button:first-child{border-top:0}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast button{white-space:nowrap;flex:none;border:0;background:transparent;color:var(--sugi-soft);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + Math.round(n || 0).toLocaleString("ja-JP");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, "0");
const hm = ts => { const d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const KEY = "izk-data-v1";
let storageOK = true;

/* ---------- text normalisation & parsing ---------- */
const KANA_NUM = [["ココノツ","9ツ"],["ヒトツ","1ツ"],["フタツ","2ツ"],["ミッツ","3ツ"],["ヨッツ","4ツ"],["イツツ","5ツ"],["ムッツ","6ツ"],["ナナツ","7ツ"],["ヤッツ","8ツ"],
  ["イッパイ","1杯"],["ニハイ","2杯"],["サンバイ","3杯"],["イッポン","1本"],["ハンゴウ","半合"],["イチゴウ","1合"],["ニゴウ","2合"],["サンゴウ","3合"],["ヒトリ","1人"],["フタリ","2人"]];
const KD = {"〇":0,"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function kanjiToNum(k){
  const dig = s => s.split("").map(c => KD[c]).join("");
  const parts = k.split("十");
  if (parts.length === 1) return dig(k);
  if (parts.length > 2) return k;
  return String((parts[0] ? +dig(parts[0]) : 1) * 10 + (parts[1] ? +dig(parts[1]) : 0));
}
function norm(s){
  s = String(s || "").normalize("NFKC").toLowerCase();
  s = s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
  s = s.replace(/[\s、。,.・!?「」『』()（）]/g, "");
  for (const [k, v] of KANA_NUM) s = s.split(k).join(v);
  s = s.replace(/号/g, "合");
  s = s.replace(/[〇零一二三四五六七八九十]+/g, kanjiToNum);
  return s;
}
/* ---------- data ---------- */
function goOf(label){
  const n = norm(label);
  if (/半合/.test(n)) return 0.5;
  const m = n.match(/(\d+(?:\.\d+)?)合/); if (m) return +m[1];
  if (/グラス/.test(n)) return 0.5;
  return 0;
}
function mk(cat, name, alias, spec){
  const variants = typeof spec === "number" ? [{label:"", price:spec, go:0}]
    : spec.split(",").map(p => { const [label, price] = p.split(":"); return {label, price:+price, go:goOf(label)}; });
  return {id:uid(), cat, name, alias, variants};
}
function sampleMenu(){
  return [
    mk("日本酒","獺祭 純米大吟醸45",["獺祭","だっさい"],"一合:1400,半合:750,グラス:800"),
    mk("日本酒","黒龍 いっちょらい",["黒龍","こくりゅう","黒竜"],"一合:1100,半合:600,グラス:650"),
    mk("日本酒","新政 No.6",["新政","あらまさ","ナンバーシックス"],"一合:1500,半合:800,グラス:850"),
    mk("日本酒","十四代 本丸",["十四代","じゅうよんだい"],"一合:1800,半合:950,グラス:1000"),
    mk("日本酒","而今 特別純米",["而今","じこん","自今"],"一合:1300,半合:700,グラス:750"),
    mk("日本酒","飛露喜 特別純米",["飛露喜","ひろき"],"一合:1200,半合:650,グラス:700"),
    mk("日本酒","利き酒 飲み比べ3種",["飲み比べ","のみくらべ","利き酒","ききざけ"],1500),
    mk("ドリンク","生ビール",["生","なま","ビール","生中","なまちゅう"],600),
    mk("ドリンク","ハイボール",["ハイボ"],500),
    mk("ドリンク","ウーロン茶",["烏龍茶","ウーロン"],300),
    mk("料理","お通し",["おとおし","突き出し"],500),
    mk("料理","だし巻き卵",["だし巻き","出汁巻き","だし巻き玉子","だしまき"],650),
    mk("料理","刺身盛り合わせ",["刺し盛り","刺盛","さしもり","刺身"],1500),
    mk("料理","枝豆",["えだまめ"],400),

const col = c => S.db.collection("shops").doc(shop).collection(c);

function menuEnt(m, i){ return Object.assign({}, m, {ord:i}); }
function ticketMeta(t){ return {table:t.table, openedAt:t.openedAt, lastAt:t.lastAt, guests:t.guests || 0, customerId:t.customerId || null}; }
function applyRemote(c, snap){
  const docs = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
  if (c === "menu") {
    D.menu = docs.sort((a, b) => (a.ord || 0) - (b.ord || 0)).map(m => { const o = Object.assign({}, m); delete o.ord; return o; });
    S.base.menu = Object.fromEntries(D.menu.map((m, i) => [m.id, stable(menuEnt(m, i))]));
    buildIndex();
  } else if (c === "customers" || c === "sales") {
    D[c] = c === "sales" ? docs.sort((a, b) => a.closedAt - b.closedAt) : docs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.base[c] = Object.fromEntries(D[c].map(o => [o.id, stable(o)]));
  } else if (c === "open") {
    const open = {}; S.base.open = {};
    for (const d of docs.sort((a, b) => (a.openedAt || 0) - (b.openedAt || 0))) {
      if (!d.table || open[d.table]) continue;
      const t = {id:d.id, table:d.table, openedAt:d.openedAt || Date.now(), lastAt:d.lastAt || Date.now(), guests:d.guests || 0, customerId:d.customerId || null,
        lines:Object.entries(d.lines || {}).map(([id, l]) => Object.assign({}, l, {id})).sort((a, b) => (a.at || 0) - (b.at || 0))};
      open[t.table] = t;
      S.base.open[t.id] = {meta:stable(ticketMeta(t)), lines:Object.fromEntries(t.lines.map(l => [l.id, stable(l)]))};
    }
    D.open = open;
  } else if (c === "config") {
    const m = docs.find(d => d.id === "main");
    if (m) { if (Array.isArray(m.tables) && m.tables.length) D.tables = m.tables; D.settings = Object.assign(seed().settings, m.settings || {}); D.sampleMenu = !!m.sampleMenu; }
    S.base.config = m ? stable({tables:D.tables, settings:D.settings, sampleMenu:!!D.sampleMenu}) : null;
  }

  if (!S.ready && COLLS.every(x => S.got.has(x))) S.ready = true;
  saveLocal(); scheduleRender();
}
function push(){
  if (!S.db || !S.ready || !shop || !S.base) return;
  const ops = []; const FV = S.fv;
  const simple = {menu:D.menu.map(menuEnt), customers:D.customers, sales:D.sales};
  for (const c in simple) {
    const seen = new Set();
    for (const o of simple[c]) { seen.add(o.id); const j = stable(o); if (S.base[c][o.id] !== j) { ops.push(b => b.set(col(c).doc(o.id), clean(o))); S.base[c][o.id] = j; } }
    for (const id of Object.keys(S.base[c])) if (!seen.has(id)) { ops.push(b => b.delete(col(c).doc(id))); delete S.base[c][id]; }
  }
  const seenT = new Set();
  for (const t of Object.values(D.open)) {
    seenT.add(t.id);
    const bs = S.base.open[t.id] || {meta:null, lines:{}};
    const upd = {}, lines = {}; let ch = false;
    const meta = ticketMeta(t), mj = stable(meta);
    if (bs.meta !== mj) { Object.assign(upd, meta); bs.meta = mj; ch = true; }
    const seenL = new Set();
    for (const l of t.lines) { seenL.add(l.id); const j = stable(l); if (bs.lines[l.id] !== j) { const o = clean(l); delete o.id; lines[l.id] = o; bs.lines[l.id] = j; ch = true; } }
    for (const id of Object.keys(bs.lines)) if (!seenL.has(id)) { lines[id] = FV.delete(); delete bs.lines[id]; ch = true; }
    if (Object.keys(lines).length) upd.lines = lines;
    if (ch) ops.push(b => b.set(col("open").doc(t.id), upd, {merge:true}));
    S.base.open[t.id] = bs;
  }
  for (const id of Object.keys(S.base.open)) if (!seenT.has(id)) { ops.push(b => b.delete(col("open").doc(id))); delete S.base.open[id]; }
  const cfg = {tables:D.tables, settings:D.settings, sampleMenu:!!D.sampleMenu}, cj = stable(cfg);
  if (S.base.config !== cj) { ops.push(b => b.set(col("config").doc("main"), clean(cfg))); S.base.config = cj; }
  for (let i = 0; i < ops.length; i += 400) {
    const b = S.db.batch(); ops.slice(i, i + 400).forEach(f => f(b));
    b.commit().catch(e => { console.error(e); setStatus("error"); toast("共有データへの保存に失敗しました（" + (e.code || e.message) + "）"); });
  }
}

function bizDate(ts){

function dateLabel(ds){ const [y,m,d] = ds.split("-").map(Number); const w = "日月火水木金土"[new Date(y, m-1, d).getDay()]; return `${m}月${d}日（${w}）`; }

let IDX = [];
function buildIndex(){
  IDX = [];
  for (const it of D.menu) for (const t of [it.name, ...(it.alias || [])]) { const n = norm(t); if (n) IDX.push({n, it}); }
  IDX.sort((a, b) => b.n.length - a.n.length);
}
function parseTail(tail, it){
  let variant = null, qty = null;
  const vs = (it.variants || []).map(v => ({v, n:norm(v.label)})).filter(x => x.n).sort((a, b) => b.n.length - a.n.length);
  for (const x of vs) if (tail.includes(x.n)) { variant = x.v; tail = tail.replace(x.n, ""); break; }
  if (!variant) {
    const g = tail.match(/(\d+(?:\.\d+)?)合/);
    if (g) { const one = it.variants.find(v => v.go === 1); if (one) { variant = one; qty = Math.round(+g[1]); tail = tail.replace(g[0], ""); } }
  }
  if (qty == null) { const q = tail.match(/(\d+)/); if (q) qty = +q[1]; }
  return {vi: it.variants.indexOf(variant || it.variants[0]), qty: Math.max(1, Math.min(99, qty || 1))};
}
function bigrams(s){ const r = []; for (let i = 0; i < s.length - 1; i++) r.push(s.slice(i, i + 2)); return r.length ? r : [s]; }
function dice(a, b){ const A = bigrams(a), B = bigrams(b).slice(); let hit = 0; for (const x of A) { const j = B.indexOf(x); if (j >= 0) { hit++; B.splice(j, 1); } } return 2 * hit / (A.length + bigrams(b).length); }
function suggest(s){
  const best = new Map();
  for (const {n, it} of IDX) {
    let sc = 0;
    for (let L = Math.max(1, n.length - 1); L <= n.length + 1; L++)
      for (let i = 0; i + L <= s.length; i++) sc = Math.max(sc, dice(s.slice(i, i + L), n));
    if (sc > (best.get(it) || 0)) best.set(it, sc);

}
function parseUtter(raw, defTable){
  let s = norm(raw);
  const r = {raw, table:null, lines:[], guests:null, cmd:null, sugg:[]};
  const named = D.tables.map(t => ({t, n:norm(t)})).filter(x => !/^\d+$/.test(x.n) && x.n.length >= 2).sort((a, b) => b.n.length - a.n.length);
  for (const {t, n} of named) if (s.includes(n)) { r.table = t; s = s.replace(n, ""); break; }
  if (!r.table) {
    const m = s.match(/(\d+)(?:番テーブル|番卓|番席|番|卓|テーブル)/) || s.match(/(?:テーブル|卓)(\d+)/);
    if (m) { const t = D.tables.find(t => norm(t) === m[1]); if (t) { r.table = t; s = s.replace(m[0], ""); } }
  }
  if (/会計|カイケイ|オアイソ|チェック/.test(s)) r.cmd = "checkout";
  else if (/取リ?消|トリケシ|キャンセル|ヤッパリナシ/.test(s)) r.cmd = "undo";

  if (g) { r.guests = +g[1]; s = s.replace(g[0], ""); }
  const hits = [];
  for (let i = 0; i < s.length;) {
    const f = IDX.find(x => s.startsWith(x.n, i));
    if (f) { hits.push({it:f.it, start:i, end:i + f.n.length}); i += f.n.length; } else i++;
  }
  hits.forEach((h, k) => {
    const tail = s.slice(h.end, k + 1 < hits.length ? hits[k + 1].start : s.length);
    const {vi, qty} = parseTail(tail, h.it);
    const same = r.lines.find(l => l.it === h.it && l.vi === vi);
    if (same) same.qty += qty; else r.lines.push({it:h.it, vi, qty});

  if (!r.lines.length && !r.cmd && r.guests == null && s.length) r.sugg = suggest(s);

}

function dayStats(ds){
  const list = D.sales.filter(s => s.biz === ds).sort((a, b) => a.closedAt - b.closedAt);
  const total = list.reduce((a, s) => a + s.total, 0);
  const guests = list.reduce((a, s) => a + (s.guests || 0), 0);
  const by = {}; list.forEach(s => by[s.method] = (by[s.method] || 0) + s.total);
  const items = {}, sake = {};
  list.forEach(s => s.lines.forEach(l => {
    const k = l.name + (l.variant ? "（" + l.variant + "）" : "");
    items[k] = items[k] || {qty:0, amt:0}; items[k].qty += l.qty; items[k].amt += l.qty * l.price;
    if (l.cat === "日本酒") { sake[l.name] = sake[l.name] || {cups:0, go:0, amt:0, vars:{}}; const z = sake[l.name];
      z.cups += l.qty; z.go += (l.go || 0) * l.qty; z.amt += l.qty * l.price; if (l.variant) z.vars[l.variant] = (z.vars[l.variant] || 0) + l.qty; }
  }));
  return {list, total, guests, groups:list.length, by, items, sake};
}

/* ---------- sheet & toast ---------- */
let sheetClose = null;
function openSheet(html, mount, onClose){
  closeSheet();
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  sheetClose = onClose || null;
  if (mount) mount($(".sheet", root));
}
function closeSheet(){ const f = sheetClose; sheetClose = null; $("#sheetRoot").innerHTML = ""; if (f) f(); }
let toastTimer;
function toast(msg, undoFn){
  clearTimeout(toastTimer);
  $("#toastRoot").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undoFn ? `<button id="toastUndo">取り消す</button>` : ""}</div>`;
  if (undoFn) $("#toastUndo").onclick = () => { undoFn(); $("#toastRoot").innerHTML = ""; };
  toastTimer = setTimeout(() => $("#toastRoot").innerHTML = "", undoFn ? 6000 : 2600);
}
function confirmSheet(title, body, okLabel, ok){
  openSheet(`<h2>${esc(title)}</h2><p>${body}</p><div class="acts"><button class="btn" data-x>やめる</button><button class="btn pri" data-ok style="background:var(--danger);border-color:var(--danger)">${esc(okLabel)}</button></div>`,
    el => { $("[data-x]", el).onclick = closeSheet; $("[data-ok]", el).onclick = () => { closeSheet(); ok(); }; });
}
function say(text){
  if (!D.settings.speak || !window.speechSynthesis) return Promise.resolve();
  return new Promise(res => {
    try { const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 1.15; u.onend = res; u.onerror = res; speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(res, 6000); }
    catch(e){ res(); }
  });
}

/* ---------- voice preview ---------- */
let pending = null, cdTimer = null;
function stopCountdown(el){ clearTimeout(cdTimer); cdTimer = null; const i = el && $(".countdown i", el); if (i) { i.style.transition = "none"; i.parentNode.hidden = true; } }
function previewSheet(p){
  pending = p;
  const tables = D.tables.map(t => `<option ${t === p.table ? "selected" : ""}>${esc(t)}</option>`).join("");
  const rows = p.lines.map((l, k) => `<div class="pv"><b class="grow">${esc(l.it.name)}</b>
      ${l.it.variants.length > 1 ? `<select data-k="${k}" data-f="vi">${l.it.variants.map((v, i) => `<option value="${i}" ${i === l.vi ? "selected" : ""}>${esc(v.label)} ${yen(v.price)}</option>`).join("")}</select>` : `<span class="small muted num">${yen(l.it.variants[0].price)}</span>`}
      <div class="stepper"><button data-k="${k}" data-q="-1">−</button><span class="num">${l.qty}</span><button data-k="${k}" data-q="1">＋</button></div></div>`).join("");
  const sugg = p.sugg.length ? `<p class="small muted">メニューが聞き取れませんでした。もしかして：</p><div class="row">${p.sugg.map(it => `<button class="btn sm" data-sg="${it.id}">${esc(it.name)}</button>`).join("")}</div>` : "";
  const nothing = !p.lines.length && !p.sugg.length && p.cmd == null && p.guests == null;
  openSheet(`<h2>注文の確認</h2>
    ${p.raw ? `<div class="raw">聞き取り：「${esc(p.raw)}」</div>` : ""}
    <div class="row"><label class="small muted" for="pvTable">卓</label><select id="pvTable" class="grow" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;min-height:42px"><option value="">卓を選んでください</option>${tables}</select>
      ${p.guests != null ? `<span class="chip sugi">${p.guests}名</span>` : ""}</div>
    ${rows}${sugg}${nothing ? `<p class="muted">メニュー名が見つかりませんでした。もう一度話すか、文字で入力してください。</p>` : ""}
    <div class="field"><label for="pvText">文字で入力・言い直し</label><div class="row"><input id="pvText" class="grow" placeholder="例：3番 獺祭 一合 2つ 唐揚げ" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px"><button class="btn sm" data-reparse>読み取る</button></div></div>
    <div class="countdown" ${D.settings.autoConfirm && p.lines.length && p.table ? "" : "hidden"}><i></i></div>
    <div class="acts"><button class="btn" data-x>やめる</button><button class="btn pri" data-ok>${p.lines.length ? "追加する" : (p.cmd === "checkout" ? "お会計へ" : "決定")}</button></div>`, el => {
    const tsel = $("#pvTable", el);
    tsel.onchange = () => { p.table = tsel.value || null; stopCountdown(el); };
    el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { const l = p.lines[+b.dataset.k]; l.qty = Math.max(0, l.qty + +b.dataset.q); if (!l.qty) p.lines.splice(+b.dataset.k, 1); stopCountdown(); previewSheet(p); });
    el.querySelectorAll("select[data-f]").forEach(s => s.onchange = () => { p.lines[+s.dataset.k].vi = +s.value; stopCountdown(el); });
    el.querySelectorAll("[data-sg]").forEach(b => b.onclick = () => { const it = D.menu.find(m => m.id === b.dataset.sg); p.lines.push({it, vi:0, qty:1}); p.sugg = []; stopCountdown(); previewSheet(p); });
    const reparse = () => { const v = $("#pvText", el).value.trim(); if (!v) return; stopCountdown(); const q = parseUtter(v, p.table); previewSheet(q); };
    $("[data-reparse]", el).onclick = reparse;
    $("#pvText", el).onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); reparse(); } };
    $("#pvText", el).onfocus = () => stopCountdown(el);
    $("[data-x]", el).onclick = () => { stopCountdown(); pending = null; closeSheet(); };
    $("[data-ok]", el).onclick = () => { stopCountdown(); commit(p); };
    if (D.settings.autoConfirm && p.lines.length && p.table) {
      const bar = $(".countdown i", el); const sec = Math.max(1, +D.settings.confirmSec || 4);
      requestAnimationFrame(() => { bar.style.transition = `transform ${sec}s linear`; bar.style.transform = "scaleX(0)"; });
      cdTimer = setTimeout(() => commit(p), sec * 1000);
    }
  }, () => { clearTimeout(cdTimer); cdTimer = null; });
}
function commit(p){
  clearTimeout(cdTimer); cdTimer = null;
  if (!p.table) { toast("卓を選んでください"); return; }
  closeSheet(); pending = null;
  const existed = !!D.open[p.table];
  const t = openTicket(p.table, 0);
  if (p.guests != null) setGuests(t, p.guests);
  if (p.cmd === "undo" && !p.lines.length) { undoLast(); return; }
  const added = [];
  for (const l of p.lines) { const line = addLine(t, l.it, l.vi, l.qty); added.push({id:line.id, qty:l.qty}); }
  if (added.length) undoStack.push({table:p.table, added, created:!existed});
  save();
  const desc = p.lines.map(l => { const v = l.it.variants[l.vi]; return `${shortName(l.it)}${v && v.label ? " " + v.label : ""} ${l.qty}つ`; }).join("、");
  if (p.cmd === "checkout" && !p.lines.length) { go("ticket", p.table); checkoutSheet(); return; }
  if (view === "ticket" || view === "tables") { if (view === "ticket") curTable = p.table; render(); }
  if (desc) { toast(`${p.table}：${desc}を追加`, undoLast); say(`${p.table}${/^\d+$/.test(p.table) ? "番" : ""}、${desc}、追加しました`).then(resumeHF); }
  else if (p.guests != null) { toast(`${p.table}：${p.guests}名で受付`); render(); resumeHF(); }
  else resumeHF();
}
function shortName(it){ return (it.alias && it.alias[0] && it.alias[0].length < it.name.length) ? it.alias[0] : it.name; }
function undoLast(){
  const u = undoStack.pop(); if (!u) { toast("取り消せる注文がありません"); return; }
  const t = D.open[u.table]; if (!t) return;
  for (const a of u.added) { const l = t.lines.find(x => x.id === a.id); if (l) { l.qty -= a.qty; if (l.qty <= 0) t.lines.splice(t.lines.indexOf(l), 1); } }
  if (u.created && !t.lines.length) delete D.open[u.table];
  save(); render(); toast("直前の注文を取り消しました"); say("取り消しました").then(resumeHF);
}

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, handsFree = false, micBlocked = false;
function defaultTable(){ return view === "ticket" ? curTable : null; }
function setLive(text){ const l = $("#live"); if (text == null) { l.hidden = true; return; } l.hidden = false; l.textContent = text; }
function listenOnce(){
  if (!SR || micBlocked) { previewSheet({raw:"", table:defaultTable(), lines:[], guests:null, cmd:null, sugg:[]}); setTimeout(() => { const i = $("#pvText"); i && i.focus(); }, 50);
    if (!SR) toast("このブラウザは音声入力に対応していません。文字で入力できます"); return; }
  if (listening) { try { rec.stop(); } catch(e){} return; }
  if (cdTimer || pending) return;
  rec = new SR(); rec.lang = "ja-JP"; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = false;
  let finalAlts = null;
  rec.onstart = () => { listening = true; $("#micBtn").classList.add("on"); setLive("聞いています…"); };
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { finalAlts = [...r].map(a => a.transcript); } else interim += r[0].transcript;
    }
    if (interim) setLive("「" + interim + "」");
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { micBlocked = true; handsFree = false; syncHF();
      toast("マイクが使えません。ブラウザの設定でマイクを許可してください。いまは文字で入力できます"); }
    else if (e.error === "no-speech") { /* quiet */ }
    else if (e.error !== "aborted") toast("聞き取りに失敗しました（" + e.error + "）");
  };
  rec.onend = () => {
    listening = false; $("#micBtn").classList.remove("on"); setLive(null);
    if (finalAlts && finalAlts.length) {
      const parses = finalAlts.map(a => parseUtter(a, defaultTable()));
      parses.sort((a, b) => (b.lines.length - a.lines.length) || ((b.table ? 1 : 0) - (a.table ? 1 : 0)));
      handleParse(parses[0]);
    } else resumeHF();
  };
  try { rec.start(); } catch(e){ listening = false; }
}
function handleParse(p){
  if (p.cmd === "undo" && !p.lines.length) { undoLast(); return; }
  if (p.cmd === "checkout" && !p.lines.length && p.table && D.open[p.table]) { go("ticket", p.table); checkoutSheet(); handsFree = false; syncHF(); return; }
  previewSheet(p);
}
function resumeHF(){ if (handsFree && !listening && !pending && !$(".scrim")) setTimeout(() => { if (handsFree && !listening && !pending && !$(".scrim")) listenOnce(); }, 350); }
function syncHF(){ $("#hfBtn").setAttribute("aria-pressed", String(handsFree)); }
$("#micBtn").onclick = () => listenOnce();
$("#hfBtn").onclick = () => {
  if (!SR || micBlocked) { toast("この画面では音声入力が使えません"); return; }
  handsFree = !handsFree; syncHF();
  if (handsFree) { toast("ハンズフリー：話し終えるたびに聞き取ります"); if (!listening) listenOnce(); }
  else if (listening) try { rec.abort(); } catch(e){}
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && $(".scrim")) { pending = null; closeSheet(); } });

/* ---------- checkout ---------- */
function checkoutSheet(){
  const t = D.open[curTable]; if (!t) return;
  const sub = ticketTotal(t);
  let disc = 0, method = "現金", guests = t.guests || 1, recv = "";
  const draw = () => {
    const total = Math.max(0, sub - disc);
    const per = Math.ceil(total / Math.max(1, guests));
    const per100 = Math.ceil(total / Math.max(1, guests) / 100) * 100;
    const change = recv !== "" ? +recv - total : null;
    return `<h2>お会計　${esc(t.table)}</h2>
      <div class="bill"><span class="muted">小計（${t.lines.reduce((a, l) => a + l.qty, 0)}点）</span><span class="num">${yen(sub)}</span>
      ${disc ? `<span class="muted">値引き</span><span class="num">−${yen(disc)}</span>` : ""}
      <span style="align-self:end;font-weight:700">合計（税込）</span><span class="big num">${yen(total)}</span></div>
      <div class="field"><label for="coDisc">値引き（円）</label><input id="coDisc" type="number" inputmode="numeric" min="0" value="${disc || ""}" placeholder="0"></div>
      <div class="field"><label>割り勘</label><div class="row"><div class="stepper"><button data-g="-1">−</button><span class="num">${guests}名</span><button data-g="1">＋</button></div>
        <span class="num">1人 ${yen(per)}</span><span class="muted small num">（100円単位なら ${yen(per100)}、${guests}名で ${yen(per100 * guests)}）</span></div></div>
      <div class="field"><label>支払い方法</label><div class="seg">${["現金","カード","QR決済","ツケ"].map(m => `<button data-m="${m}" aria-pressed="${m === method}">${m}</button>`).join("")}</div></div>
      ${method === "ツケ" && !t.customerId ? `<p class="small" style="color:var(--warn)">ツケにするときは、先にお客さんを選んでください。</p>` : ""}
      ${method === "現金" ? `<div class="field"><label for="coRecv">お預かり（円）</label><input id="coRecv" type="number" inputmode="numeric" value="${recv}" placeholder="${total}">
        ${change != null ? `<span class="num" style="font-weight:700;font-size:18px;color:${change < 0 ? "var(--danger)" : "var(--ok)"}">${change < 0 ? "不足 " + yen(-change) : "おつり " + yen(change)}</span>` : ""}</div>` : ""}
      <div class="acts"><button class="btn" data-x>戻る</button><button class="btn pri" data-ok ${method === "ツケ" && !t.customerId ? "disabled" : ""}>お会計を確定</button></div>`;
  };
  const mount = el => {
    $("[data-x]", el).onclick = closeSheet;
    $("#coDisc", el).onchange = e => { disc = Math.max(0, +e.target.value || 0); redraw(); };
    el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { guests = Math.max(1, guests + +b.dataset.g); redraw(); });
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { method = b.dataset.m; redraw(); });
    const r = $("#coRecv", el); if (r) r.onchange = e => { recv = e.target.value; redraw(); };
    $("[data-ok]", el).onclick = () => {
      const now = Date.now();
      const sale = Object.assign({}, t, {id:uid(), lines:t.lines.map(l => Object.assign({}, l)), subtotal:sub, discount:disc, total:Math.max(0, sub - disc), method, guests:t.guests || guests, closedAt:now, biz:bizDate(now), paidAt:method === "ツケ" ? null : now});
      D.sales.push(sale); delete D.open[t.table]; undoStack = undoStack.filter(u => u.table !== t.table);
      save(); closeSheet(); go("tables"); toast(`${t.table}　${yen(sale.total)}　お会計しました`);
    };
  };
  const redraw = () => { const el = $(".sheet"); if (!el) return; el.innerHTML = draw(); mount(el); };
  openSheet(draw(), mount);
}

/* ---------- files ---------- */
async function saveFile(filename, text, type){
  const blob = new Blob([text], {type});
  try {
    if (window.claude && window.claude.use) { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({filename, data:blob}); return; } }
  } catch(e){ if (e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(sales){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [["営業日","お会計時刻","卓","お客さん","人数","支払い","品目","量","単価","数量","金額","伝票合計","値引き"]];
  for (const s of sales) { const cu = s.customerId && D.customers.find(c => c.id === s.customerId);
    for (const l of s.lines) rows.push([s.biz, new Date(s.closedAt).toLocaleString("ja-JP"), s.table, cu ? cu.name : "", s.guests || "", s.method, l.name, l.variant, l.price, l.qty, l.price * l.qty, s.total, s.discount || 0]); }
  return "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n");
}

/* ---------- events ---------- */

  else if (a === "salesShift") { salesDate = shiftDate(salesDate, +b.dataset.d); render(); }
  else if (a === "salesDate") { salesDate = b.dataset.d; render(); }
  else if (a === "showSale") saleSheet(D.sales.find(s => s.id === b.dataset.id));
  else if (a === "csvDay") saveFile(`売上_${salesDate}.csv`, csv(D.sales.filter(s => s.biz === salesDate)), "text/csv");
  else if (a === "csvAll") saveFile(`売上_全期間.csv`, csv(D.sales), "text/csv");
  else if (a === "newCust") custEditSheet(null);
  else if (a === "showCust") custDetail(D.customers.find(c => c.id === b.dataset.id));
  else if (a === "editItem") itemSheet(D.menu.find(m => m.id === b.dataset.id) || null);
  else if (a === "saveSettings") {
    const s = D.settings;
    const tables = $("#setTables").value.split(/[,、，]/).map(x => x.trim()).filter(Boolean);
    if (tables.length) D.tables = [...new Set(tables)];
    s.otoshiName = $("#setOtoshi").value; s.autoOtoshi = $("#setAutoOtoshi").checked;
    s.idleMin = Math.max(5, +$("#setIdle").value || 40); s.cutoff = Math.min(12, Math.max(0, +$("#setCutoff").value || 0));
    s.autoConfirm = $("#setAuto").checked; s.confirmSec = Math.min(15, Math.max(1, +$("#setSec").value || 4)); s.speak = $("#setSpeak").checked;
    save(); render(); toast("設定を保存しました");
  }
  else if (a === "backup") saveFile(`お会計バックアップ_${bizDate(Date.now())}.json`, JSON.stringify(D), "application/json");
  else if (a === "syncStart") {
    if (!FIREBASE_CONFIG) { toast("共有の準備がまだできていません"); return; }
    shop = newShopCode(); try { localStorage.setItem(SHOP_KEY, shop); } catch(e){}
    startSync("create").then(render); render(); toast("共有を始めました。ほかの端末にリンクを送ってください");
  }
  else if (a === "syncJoin") joinShop($("#joinCode").value);
  else if (a === "syncCopy") { const v = joinLink(); const done = () => toast("リンクをコピーしました");
    try { navigator.clipboard.writeText(v).then(done, () => { const i = $("#shopLink"); i.focus(); i.select(); }); } catch(e){ const i = $("#shopLink"); i.focus(); i.select(); } }
  else if (a === "syncStop") confirmSheet("この端末の共有をやめますか？", "この端末はほかの端末と同期しなくなります。いまのデータはこの端末に残ります。合言葉があれば、あとでまた参加できます。", "共有をやめる", () => {
    stopListeners(); shop = null; S.base = null; try { localStorage.removeItem(SHOP_KEY); } catch(e){} setStatus("off"); render(); });
  else if (a === "wipe") confirmSheet("すべて消しますか？", (shop ? "共有中のすべての端末から、" : "") + "メニュー・売上・お客さんの記録がすべて消えます。先にバックアップを保存してください。", "すべて消す", () => { D = seed(); buildIndex(); save(); go("tables"); });
});
document.addEventListener("input", e => {
  if (e.target.id === "custSearch") { custQuery = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#custSearch"); i.focus(); try { i.setSelectionRange(pos, pos); } catch(_){} }
});
document.addEventListener("change", e => {
  if (e.target.id === "restoreFile" && e.target.files[0]) {
    const f = e.target.files[0]; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.menu) || !Array.isArray(d.sales)) throw 0;
      confirmSheet("バックアップから戻しますか？", "いまのデータはバックアップの内容に置き換わります。", "戻す", () => { D = d; D.settings = Object.assign(seed().settings, D.settings || {}); buildIndex(); save(); go("tables"); toast("バックアップから戻しました"); }); }
      catch(_){ toast("このファイルは読み込めません"); } };
    r.readAsText(f);
  }
});
setInterval(() => { if (view === "tables" && !$(".scrim")) render(); }, 60000);

/* ---------- PWA ---------- */
try { if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){}

window.__izk = {parseUtter, norm, get D(){ return D; }};
buildIndex(); render();
if (shop && FIREBASE_CONFIG) startSync("resume");
{ const m = location.hash.match(/^#join=([A-Za-z0-9-]+)/); if (m) { try { history.replaceState(null, "", location.pathname); } catch(e){} if (normCode(m[1]) !== shop) joinShop(m[1]); } }
})();
</script>
